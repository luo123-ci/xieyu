<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>爱莉希雅 动态主页</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif}
body{
  min-height:100vh;
  background:linear-gradient(135deg,#ffd6e8,#f8c8e0,#e8b8dd);
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}
.petal{
  position:absolute;
  width:20px;height:20px;
  background:#ffb8d8;
  border-radius:50% 0 50% 50%;
  opacity:0.7;
  animation:fall linear infinite;
  z-index:1;
}
@keyframes fall{
  0%{
    transform:translateY(-10vh) rotate(0deg);
    opacity:0.8;
  }
  100%{
    transform:translateY(105vh) rotate(720deg);
    opacity:0;
  }
}
.card{
  width:90%;max-width:420px;
  background:rgba(255,255,255,0.72);
  backdrop-filter:blur(12px);
  border-radius:24px;
  padding:32px;
  box-shadow:0 8px 32px rgba(230,130,180,0.25);
  position:relative;
  z-index:2;
  border:1px solid rgba(255,255,255,0.85);
  transition:0.3s ease;
}
.card:hover{
  transform:translateY(-6px);
  box-shadow:0 12px 40px rgba(230,130,180,0.35);
}
.avatar{
  width:110px;height:110px;
  margin:0 auto 16px;
  border-radius:50%;
  background:#ffc8e0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
  color:#fff;
  border:3px solid #ff99c8;
  animation:shine 2.5s ease-in-out infinite alternate;
}
@keyframes shine{
  from{box-shadow:0 0 12px #ffb8d8;}
  to{box-shadow:0 0 24px #ff88bb,0 0 36px #ffb8d8;}
}
h1{
  text-align:center;
  color:#c84b88;
  font-size:26px;
  margin-bottom:8px;
}
.tag{
  text-align:center;
  color:#d470a0;
  font-size:14px;
  margin-bottom:24px;
}
.text-box{
  min-height:80px;
  text-align:center;
  font-size:16px;
  color:#903b68;
  line-height:1.7;
  margin-bottom:24px;
}
.btns{
  display:flex;
  gap:12px;
  justify-content:center;
}
button{
  padding:10px 20px;
  border:none;
  border-radius:99px;
  background:#f28fb8;
  color:white;
  font-size:15px;
  cursor:pointer;
  transition:0.25s;
}
button:hover{
  background:#e072a0;
  transform:scale(1.05);
}
button.secondary{
  background:rgba(255,180,210,0.45);
  color:#b04878;
}
button.secondary:hover{
  background:rgba(255,180,210,0.7);
}
.footer{
  margin-top:22px;
  text-align:center;
  font-size:13px;
  color:#c978a0;
}
</style>
</head>
<body>
<div class="card">
  <div class="avatar">💖</div>
  <h1>爱莉希雅</h1>
  <div class="tag">♪ 逐火之蛾 人之律者 ♪</div>
  <div class="text-box" id="say">
    欢迎来到爱莉希雅的世界呀～
  </div>
  <div class="btns">
    <button onclick="changeWord()">和爱莉希雅对话</button>
    <button class="secondary" onclick="spark()">绽放星光</button>
  </div>
  <div class="footer">
    愿所有美好，都被温柔铭记 ✧
  </div>
</div>

<script>
function createPetal(){
  const p = document.createElement('div');
  p.className='petal';
  p.style.left = Math.random()*100 + 'vw';
  p.style.animationDuration = (4+Math.random()*5)+'s';
  p.style.transform = `scale(${0.4+Math.random()*0.7})`;
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),9000);
}
setInterval(createPetal,350);

const words = [
  "♡ 我是爱莉希雅，人之律者，也是所有人的好朋友哦。",
  "世界很美好，值得我们用心去热爱。",
  "不要难过啦，爱莉希雅会陪着你的。",
  "你看，花儿在绽放，星光也在闪烁。",
  "每一个人，都拥有属于自己的美丽。",
  "想要和爱莉希雅，一起去看看这个世界吗？",
  "哪怕前路布满荆棘，也不要忘记温柔。",
  "♪ 这份美丽，是献给你的礼物。",
  "你本身，就是一件很珍贵的宝物。",
  "爱莉希雅永远不会忘记你。"
];
let idx=0;
const el = document.getElementById('say');
function changeWord(){
  idx = (idx+1)%words.length;
  el.innerHTML = words[idx];
}

function spark(){
  for(let i=0;i<25;i++){
    const s = document.createElement('div');
    s.style.position='fixed';
    s.style.width='6px';
    s.style.height='6px';
    s.style.background='#fff';
    s.style.borderRadius='50%';
    s.style.left='50%';
    s.style.top='50%';
    s.style.zIndex=999;
    s.style.boxShadow='0 0 8px #ffc8e8';
    document.body.appendChild(s);
    const ang = Math.random()*Math.PI*2;
    const dis = 60+Math.random()*160;
    const tx = Math.cos(ang)*dis;
    const ty = Math.sin(ang)*dis;
    s.animate([
      {transform:'translate(0,0)',opacity:1},
      {transform:`translate(${tx}px,${ty}px)`,opacity:0}
    ],{duration:700,easing:'ease-out'});
    setTimeout(()=>s.remove(),700);
  }
}
</script>
</body>
</html>
